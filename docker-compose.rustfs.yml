name: mira-rustfs

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: mira-rustfs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-miraadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-miraadmin-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs
    command: /data

volumes:
  rustfs-data:
  rustfs-logs:
