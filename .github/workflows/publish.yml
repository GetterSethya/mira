name: Publish

# Tag-driven releases:
#   v0.1.0-alpha.33  -> npm dist-tag `alpha`, and `latest` is moved onto it too
#                       (pre-1.0 policy: the package page should show the newest
#                       build; stable releases take `latest` back)
#   v0.1.0           -> npm dist-tag `latest`
#
# Authentication uses npm Trusted Publishing (OIDC). No npm token exists in this
# repository: the publish jobs exchange a short-lived GitHub OIDC token for a
# scoped npm credential, and npm attaches provenance attestations automatically.
#
# One-time setup per package on npmjs.com (Settings -> Trusted publisher):
#   organization/user  GetterSethya
#   repository         mira
#   workflow filename  publish.yml
#   environment        npm_alpha   (no reviewers, allow npm publish AND npm dist-tag)
#                      npm_stable  (required reviewers, allow npm publish)

on:
  push:
    tags:
      - "v*"

# Least privilege by default; individual jobs widen it.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      dist_tag: ${{ steps.info.outputs.dist_tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Fails unless every publishable manifest has the same version and the tag
      # is exactly `v<version>`. Nothing is built before this passes.
      - name: Validate tag against package versions
        id: info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.ts info "$RELEASE_TAG"

  build:
    name: Build, test, pack
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build dashboard SPA
        run: pnpm build:ui

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # `pnpm pack` rewrites `workspace:*` to exact versions. The tarballs
      # uploaded here are byte-for-byte what gets published; the publish jobs do
      # not rebuild anything.
      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"
          for dir in \
            packages/collection \
            packages/client \
            packages/mira \
            packages/tanstack-adapter \
            packages/dashboard
          do
            echo "packing $dir"
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/npm-pack" --json > /dev/null
          done
          ls -l "$RUNNER_TEMP/npm-pack"

      - name: Upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish_alpha:
    name: Publish alpha
    needs: [verify, build]
    if: needs.verify.outputs.channel == 'alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm_alpha
      url: https://www.npmjs.com/package/@gettersethya/mira
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-pack

      # `npm dist-tag` over OIDC needs npm >= 11.21 (12.x recommended); the npm
      # bundled with the runner may be older.
      - name: Upgrade npm
        run: npm install --global npm@12

      - name: Publish to npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/publish-tarballs.ts" \
            "$RUNNER_TEMP/npm-pack" "$VERSION" "$DIST_TAG"

      # Pre-1.0 policy: an alpha is also the newest build, so the package page
      # (which renders the `latest` tag) should show it. Stable releases take
      # `latest` back automatically because they publish with --tag latest.
      - name: Point latest at the new alpha
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for name in \
            "@gettersethya/mira-collection" \
            "@gettersethya/mira-client" \
            "@gettersethya/mira" \
            "@gettersethya/mira-tanstack-adapter" \
            "@gettersethya/mira-dashboard"
          do
            npm dist-tag add "${name}@${VERSION}" latest
          done

  publish_stable:
    name: Publish stable
    needs: [verify, build]
    if: needs.verify.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm_stable
      url: https://www.npmjs.com/package/@gettersethya/mira
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-pack

      - name: Publish to npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/publish-tarballs.ts" \
            "$RUNNER_TEMP/npm-pack" "$VERSION" "$DIST_TAG"

  release:
    name: GitHub release
    needs: [verify, build, publish_alpha, publish_stable]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.publish_alpha.result == 'success' || needs.publish_stable.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists, leaving it untouched"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
