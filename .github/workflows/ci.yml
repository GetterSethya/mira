name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  libsql-e2e:
    name: libSQL sqld e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.33
        ports:
          - 8080:8080
    env:
      MIRA_LIBSQL_E2E: "1"
      MIRA_LIBSQL_URL: "http://127.0.0.1:8080"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run sqld e2e
        run: pnpm --filter @gettersethya/mira exec vitest run tests/databases/libsql-sqld.e2e.test.ts

      - name: Bun remote libSQL smoke
        run: bun run packages/bun-e2e/src/libsql-smoke.ts

  postgres-e2e:
    name: PostgreSQL e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mira_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MIRA_TEST_POSTGRES_URL: "postgres://postgres:mira@127.0.0.1:5432/mira_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run PostgreSQL e2e
        run: pnpm --filter @gettersethya/mira exec vitest run tests/databases/postgres.e2e.test.ts tests/databases/postgres-migrator.e2e.test.ts tests/databases/postgres-cursor.e2e.test.ts tests/collection-service/postgres-batch.test.ts tests/telemetry/postgres-shared.test.ts --no-file-parallelism

      - name: Bun PostgreSQL smoke
        run: bun run packages/mira/tests/databases/postgres-bun.e2e.ts

  mysql-e2e:
    name: MySQL/MariaDB e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mira
          MYSQL_DATABASE: mira_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmira --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mira
          MARIADB_DATABASE: mira_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pmira --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      MIRA_TEST_MYSQL_URL: "mysql://root:mira@127.0.0.1:3306/mira_test"
      MIRA_TEST_MARIADB_URL: "mysql://root:mira@127.0.0.1:3307/mira_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run MySQL/MariaDB e2e
        run: pnpm --filter @gettersethya/mira exec vitest run tests/databases/mysql-migrator.e2e.test.ts --no-file-parallelism

  bun-smoke:
    name: Bun smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # Mira's Bun platform requires >= 1.3.14 (Bun.Image); this pins the tested baseline.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Landing
        run: |
          pnpm --filter @gettersethya/mira-landing check
          pnpm --filter @gettersethya/mira-landing check:docs
          pnpm --filter @gettersethya/mira-landing docs:api

      - name: Test
        run: pnpm -r test

      - name: Pack/install smoke
        run: node scripts/pack-smoke.mjs

      - name: Bun smoke
        run: bun run packages/bun-e2e/src/smoke.ts

      - name: Bun libSQL local smoke
        run: bun run packages/bun-e2e/src/libsql-smoke.ts

      - name: Bun example boot
        run: |
          set -euo pipefail
          export DB_PATH="$RUNNER_TEMP/mira-bun.db"
          export UPLOAD_DIR="$RUNNER_TEMP/mira-bun-uploads"
          export PORT=$(( (RANDOM % 10000) + 40000 ))
          bun run apps/example-bun/src/index.ts > "$RUNNER_TEMP/bun-example.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            for candidate in $(seq "$PORT" $((PORT + 9))); do
              if curl -fsS "http://127.0.0.1:${candidate}/_dashboard/api/bootstrap-status" > /dev/null; then
                exit 0
              fi
            done
            sleep 1
          done
          cat "$RUNNER_TEMP/bun-example.log"
          exit 1
